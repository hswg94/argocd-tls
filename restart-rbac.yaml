apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocdtlsrestartsa
  namespace: argocd
---
# Scoped to exactly the two resources the restart CronJob touches - can't
# read/patch anything else in the argocd namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-server-restarter
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-server-tls"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["argocd-server"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-server-restarter
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-server-restarter
subjects:
  - kind: ServiceAccount
    name: argocdtlsrestartsa
    namespace: argocd

