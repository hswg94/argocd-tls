apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocdtlsdeployment
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocdtlsdeployment
  template:
    metadata:
      labels:
        app: argocdtlsdeployment
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: argocdtlssa
      containers:
        - name: sync
          image: mcr.microsoft.com/oss/kubernetes/pause:3.6
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: argocdtlsspc
